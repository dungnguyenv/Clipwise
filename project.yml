name: Clipwise
options:
  bundleIdPrefix: com.clipwise
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    GENERATE_INFOPLIST_FILE: true
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1

targets:
  Clipwise:
    type: application
    platform: macOS
    sources:
      - path: Clipwise
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clipwise.app
        PRODUCT_NAME: Clipwise
        INFOPLIST_FILE: Clipwise/Info.plist
        CODE_SIGN_ENTITLEMENTS: Clipwise/Clipwise.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: true
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: true
    info:
      path: Clipwise/Info.plist
      properties:
        LSUIElement: true
        NSAppleEventsUsageDescription: "Clipwise needs permission to paste content into other applications."
        CFBundleDisplayName: Clipwise
        CFBundleName: Clipwise
